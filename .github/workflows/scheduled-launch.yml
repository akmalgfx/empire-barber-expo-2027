# Ticket-drop launch: merges the `launch` branch into `main` so the 2027
# landing page replaces the waitlist on barberexpo.ca.
#
# Runs at 16:45 UTC on Nov 9 = 9:45 AM Mountain Standard Time.
# GitHub can start scheduled jobs a few minutes late.
# To launch by hand: Actions tab > Scheduled launch > Run workflow.
# Safe to delete this file after launch.

name: Scheduled launch

on:
  schedule:
    - cron: '45 16 9 11 *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: scheduled-launch
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Only run the schedule in 2026
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y)" != "2026" ]; then
            echo "Not 2026, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out main
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge launch into main and push
        id: merge
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin launch
          if git merge-base --is-ancestor origin/launch HEAD; then
            echo "launch is already merged into main, nothing to do."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A conflict fails this step and pushes nothing.
          git merge --no-ff origin/launch -m "Launch: 2027 landing page goes live (scheduled)"
          git push origin main
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Ask GitHub Pages to rebuild
        if: steps.merge.outputs.merged == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
