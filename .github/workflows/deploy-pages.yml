# Publishes barberexpo.ca on every push to main.
# Replaces GitHub's built-in "Deploy from a branch" build, whose deploy step
# kept stalling. The site is plain HTML, so files are copied as they are.
# To redeploy by hand: Actions tab > Deploy site > Run workflow.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the public site files
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '.claude' --exclude '.gitignore' \
            --exclude '.DS_Store' --exclude '_site' \
            --exclude 'README.md' --exclude 'apps-script' --exclude 'barberexpo.ca-audit' --exclude 'print'
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
